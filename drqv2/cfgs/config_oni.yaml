defaults:
  - _self_
  - task@_global_: hopper_hop #quadruped_walk
  - override hydra/launcher: submitit_local

# task settings
frame_stack: 3
action_repeat: 2
discount: 0.99
# train settings
num_seed_frames: 4000
# eval
eval_every_frames: 10000
num_eval_episodes: 10
# snapshot
save_snapshot: false  # true or false
# replay buffer
replay_buffer_size: 1000000
replay_buffer_num_workers: 4
nstep: 3
batch_size: 256
# misc
seed: 1    #------------------------------------------------- seed
device: cuda
cuda_id: 0
save_video: false  # true or false
save_train_video: false  # true or false
use_tb: true  # true or false
# experiment
experiment: exp
# agent
lr: 1e-4    # 5e-5, 7.5e-5, 2e-4, 5e-4, 1e-3
feature_dim: 50

agent:
  _target_: drqv2.DrQV2AgentOni
  obs_shape: ??? # to be specified later
  action_shape: ??? # to be specified later
  device: ${device}
  lr: ${lr}
  critic_target_tau: 0.01
  update_every_steps: 2
  use_tb: ${use_tb}
  num_expl_steps: 2000
  hidden_dim: 1024
  feature_dim: ${feature_dim}
  stddev_schedule: ${stddev_schedule}
  stddev_clip: 0.3
  encode: 0      # plain:0 ,  oni:1 ,  BN:2
  oni_range: 0   # plain:0 ,  only critic:1 ,  actor&critic:2
  oni_t: 1
  oni_nscale: 1.414
  actor_norm: 1   # plain:0 ,  BN:1
  actor_hidden_len: 2
  critic_norm: 2  # plain:0 ,  oni:1 ,  BN:2 ,  RBN:3 ,  CBN:4
  critic_hidden_len: 2
  update_mode: 'TTETT'
  momentum_value: 0.1
  mix_mode: 'buffer' #"buffer": a~buffer, "no":do not mix
  mix_rate: 1

hydra:
  run:
    dir: ./exp_local/${now:%Y.%m.%d}/${now:%H%M%S}_${hydra.job.override_dirname}
  sweep:
    dir: ./exp/${now:%Y.%m.%d}/${now:%H%M}_${agent_cfg.experiment}
    subdir: ${hydra.job.num}
  launcher:
    timeout_min: 4300
    cpus_per_task: 10
    gpus_per_node: 1
    tasks_per_node: 1
    mem_gb: 160
    nodes: 1
    submitit_folder: ./exp/${now:%Y.%m.%d}/${now:%H%M%S}_${agent_cfg.experiment}/.slurm
